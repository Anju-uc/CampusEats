<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>frontend</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openCashfreeCheckout = function(options, onComplete, onError) {
      try {
        if (typeof window.Cashfree === 'undefined') {
          onError('Cashfree SDK is not loaded. Please check your connection.');
          return;
        }
        var mode = (options && options.environment ? options.environment : 'sandbox').toLowerCase();
        var cashfree = window.Cashfree({ mode: mode });
        var checkoutOptions = {
          paymentSessionId: options.paymentSessionId,
          redirectTarget: options.redirectTarget || '_modal'
        };
        cashfree.checkout(checkoutOptions).then(function(result) {
          if (result && result.error) {
            onError(result.error.message || 'Payment cancelled or closed');
          } else {
            onComplete({
              orderId: options.orderId,
              paymentSessionId: options.paymentSessionId
            });
          }
        }).catch(function(err) {
          onError(err ? (err.message || String(err)) : 'Payment error');
        });
      } catch (e) {
        onError(e.message || String(e));
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
